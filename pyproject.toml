[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcenter"
version = "1.0.0"
description = "A Flask-based job scheduling and management system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "guomaoqiu,youguanxinqing", email = "youguanxinqing@qq.com"}
]
maintainers = [
    {name = "guomaoqiu,youguanxinqing", email = "youguanxinqing@qq.com"}
]
keywords = ["flask", "job-scheduler", "apscheduler", "task-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "flask>=1.1.2,<2.0.0",
    "flask-bootstrap>=3.3.7.1,<4.0.0",
    "flask-login>=0.5.0,<1.0.0",
    "flask-mail>=0.9.1,<1.0.0",
    "flask-migrate>=3.0.0",
    "flask-moment>=0.10.0,<1.0.0",
    "flask-sqlalchemy>=2.4.4,<3.0.0",
    "flask-script>=2.0.6,<3.0.0",
    "flask-wtf>=0.14.3,<1.0.0",
    "Jinja2>=2.11.2,<3.0.0",
    "mako>=1.0.0",
    "markupsafe>=1.1.1,<2.0.0",
    "sqlalchemy>=1.3.16,<2.0.0",
    "wtforms>=2.3.3,<3.0.0",
    "alembic>=1.0.0",
    "blinker>=1.4,<2.0.0",
    "click>=8.1.7,<9.0.0",
    "itsdangerous>=1.1.0,<2.0.0",
    "python-editor>=1.0.0",
    "Werkzeug>=1.0.1,<2.0.0",
    "python-dotenv>=0.19.0",
    "requests>=2.24.0,<3.0.0",
    "pymysql>=1.0.0",
    "urllib3>=1.24.2",
    "pymongo>=4.0.0",
    "redis>=2.10.6,<3.0.0",
    "flask-debugtoolbar>=0.13.0",
    "flask-apscheduler>=1.11.0,<2.0.0",
    "flask-cors>=3.0.8,<4.0.0",
    "gitpython>=3.0.0",
    "email-validator>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-flask>=1.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
    "isort>=5.13.2",
]

[project.urls]
Homepage = "https://github.com/youguanxinqing/jobcenter"
Documentation = "https://github.com/youguanxinqing/jobcenter#readme"
Repository = "https://github.com/youguanxinqing/jobcenter.git"
"Bug Tracker" = "https://github.com/youguanxinqing/jobcenter/issues"

[project.scripts]
jobcenter = "run:app"
jobcenter-run = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/**/*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':'
    "B008",  # do not perform function calls in argument defaults
    "UP031",
    "UP030",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.isort]
multi_line_output = 3
line_length = 88
include_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "flask_*",
    "pymysql.*",
    "apscheduler.*",
]
ignore_missing_imports = true 
